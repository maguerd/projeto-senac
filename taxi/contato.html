<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página de Contato</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button {
            background-color: #007BFF;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .mapa-local {
            width: 100%;
            max-width: 500px;
        }

        .mapa-local iframe {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Fale Conosco</h2>

        <form action="#" method="POST">

            <div class="form-group">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    placeholder="Seu nome completo"
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="seu@email.com"
                >
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    required
                    placeholder="Escreva sua mensagem aqui..."
                ></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>

        </form>
    </div>

    <div class="mapa-local">
        <iframe
            src="https://www.google.com/maps/embed?pb="
            allowfullscreen=""
            loading="lazy">
        </iframe>
    </div>

</body>

</html>

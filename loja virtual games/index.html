<body class="bodysobre">

    <header>
        <h1>
            <fieldset>
              " Pixel Store" Visite Nossa Loja Virtual"
            </fieldset>

        <h3>
            Produtos com Tecnologia de Ponta e Orçamento que Cabe no Seu Bolso.

    <main>

        <nav>

        <section>
            <h2 id="local">Digite seu nome</h2>
            
            <h2 id="localemail">Digite seu Email</h2>
            
            

            <form>

                <div>
                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                    <button onclick="apresentacao()" type="button" >Bem vindo</button>
                    <br>
                
                    
                </div>

                <br>

                <div>
                    <label for="email">email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    
                        required
                    
                        
                    >
                    <button onclick="verificaemail()" type="button">email</button>
                </div>

                <br>

                <div>
                    <label for="mensagem">Mensagem:</label>
                    <br>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        placeholder="Escreva sua mensagem"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <br>

                <button type="submit">
                    Enviar
                </button>

            </form>
        </section>

    </main>
